name: Build Builder Image

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'
  push:
    paths:
      - scripts/Dockerfile
      - .github/workflows/build-builder.yml

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish ARM64 builder image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/r0bb10/pve-kernel-builder:latest
          cache-from: type=gha,scope=kernel-builder
          cache-to: type=gha,mode=max,scope=kernel-builder
